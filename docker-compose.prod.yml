services:
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    healthcheck:
      test: ["CMD","rabbitmq-diagnostics","-q","ping"]
      interval: 15s
      timeout: 10s
      retries: 15
  backend:
    build: .
    env_file: .env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//   # 내부 서비스명 고정(.env의 localhost 무시)
      REDIS_URL: redis://redis:6379/0
      # 운영(Vercel) OAuth 리다이렉트 — .env의 localhost 값을 덮어씀
      GITHUB_REDIRECT_URI: https://team-f-frontend.vercel.app/auth/callback
      FRONTEND_URL: https://team-f-frontend.vercel.app
      # 클라우드 배포 — 자동감지가 로컬주소 대신 공개 URL(터널)을 안내하도록
      PUBLIC_DEPLOYMENT: "1"
    expose: ["8000"]   # 호스트 노출 X — Caddy(내부 네트워크)로만 접근
    depends_on:
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_started}
    command: ["uvicorn","app.main:app","--host","0.0.0.0","--port","8000"]
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//   # 내부 서비스명 고정(.env의 localhost 무시)
      REDIS_URL: redis://redis:6379/0
    depends_on:
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_started}
    command: ["celery","-A","app.celery_app","worker","--loglevel=info","--concurrency=2"]
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports: ["80:80","443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [backend]
    restart: unless-stopped
volumes:
  caddy_data:
