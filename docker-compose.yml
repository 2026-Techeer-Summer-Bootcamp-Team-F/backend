# AI 레드팀 백엔드 로컬 개발 — ARCHITECTURE.md §1 (db+redis+api)
# 실행: docker compose up --build   →  API http://localhost:8000/health
# (프론트는 별도 레포에서 npm run dev. 통합 게이트웨이는 배포 시 nginx.)
services:
  db:
    image: pgvector/pgvector:pg16          # postgres + pgvector(벡터검색)
    environment:
      POSTGRES_USER: redteam
      POSTGRES_PASSWORD: redteam
      POSTGRES_DB: redteam
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redteam"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://redteam:redteam@db:5432/redteam
      REDIS_URL: redis://redis:6379/0
      AUTH_MODE: ${AUTH_MODE:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # (확장) Celery 워커 — 진화엔진 별도 프로세스. celery app 배선 후 활성화.
  # worker:
  #   build: .
  #   command: ["celery", "-A", "app.tasks", "worker", "--loglevel=info"]
  #   environment:
  #     DATABASE_URL: postgresql+psycopg://redteam:redteam@db:5432/redteam
  #     REDIS_URL: redis://redis:6379/0
  #   depends_on: [db, redis]

volumes:
  pgdata:
