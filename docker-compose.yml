# AI 레드팀 백엔드 로컬 개발 — ARCHITECTURE.md §1 (db+redis+api)
# 실행: docker compose up --build   →  API http://localhost:8000/health
# (프론트는 별도 레포에서 npm run dev. 통합 게이트웨이는 배포 시 nginx.)
services:
  db:
    image: pgvector/pgvector:pg16          # postgres + pgvector(벡터검색)
    environment:
      POSTGRES_USER: redteam
      POSTGRES_PASSWORD: redteam
      POSTGRES_DB: redteam
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redteam"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"          # 호스트 6380 (6379는 다른 프로젝트가 점유). 컨테이너 내부는 6379 그대로

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://redteam:redteam@db:5432/redteam
      REDIS_URL: redis://redis:6379/0
      AUTH_MODE: ${AUTH_MODE:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # 개발용: 호스트 코드 마운트 + --reload → 편집 즉시 반영(리빌드 불필요)
    volumes:
      - ./:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Celery 워커 — 진화엔진(스캔)을 별도 프로세스에서 실행. FastAPI가 큐에 넣으면 여기가 꺼내 돎.
  worker:
    build: .
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+psycopg://redteam:redteam@db:5432/redteam
      REDIS_URL: redis://redis:6379/0
      AUTH_MODE: ${AUTH_MODE:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # 개발용: 호스트 코드 마운트 → 편집 즉시 반영(리빌드 불필요). (backend와 동일)
    volumes:
      - ./:/app

volumes:
  pgdata:
