# AI 레드팀 백엔드 로컬 개발 — ARCHITECTURE.md §1
# 실행: docker compose up --build   →  API http://localhost:8000/health
# 아키텍처(2026-07-10): 브로커=RabbitMQ, Redis=캐시·rate-limit·result, SSE=Postgres 폴링.
# UI: Swagger :8000/docs · RabbitMQ :15672 · Jaeger :16686 · Grafana :3000 · Prometheus :9090
services:
  db:
    image: pgvector/pgvector:pg16          # postgres + pgvector(벡터검색)
    environment:
      POSTGRES_USER: redteam
      POSTGRES_PASSWORD: redteam
      POSTGRES_DB: redteam
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redteam"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis — 캐시(벡터검색 결과)·rate-limit·Celery result backend (브로커 아님, 2026-07-10)
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"          # 호스트 6380 (6379는 다른 프로젝트가 점유). 컨테이너 내부는 6379 그대로
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # RabbitMQ — Celery 메시지 브로커(태스크 배달). management = 웹 UI(:15672, guest/guest)
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"          # amqp (브로커)
      - "15672:15672"        # 관리 UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://redteam:redteam@db:5432/redteam
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      AUTH_MODE: ${AUTH_MODE:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    # 개발용: 호스트 코드 마운트 + --reload → 편집 즉시 반영(리빌드 불필요)
    volumes:
      - ./:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Celery 워커 — 진화엔진(스캔)을 별도 프로세스에서 실행. RabbitMQ 큐에서 일감을 꺼내 돎.
  worker:
    build: .
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+psycopg://redteam:redteam@db:5432/redteam
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      AUTH_MODE: ${AUTH_MODE:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 개발용: 호스트 코드 마운트 → 편집 즉시 반영(리빌드 불필요). (backend와 동일)
    volumes:
      - ./:/app

  # ── 관측성 스택(운영/데모용) — ARCHITECTURE.md §3.11 ──
  # Prometheus: 메트릭 수집(backend /metrics 스크레이프)
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"          # 호스트 9091 (9090은 다른 프로젝트 점유). 컨테이너 내부는 9090

  # Grafana: 대시보드·경보 → Slack. 데이터소스(Prometheus·Loki) 자동 프로비저닝.
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./ops/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"          # 호스트 3001 (3000은 다른 프로젝트 점유). 컨테이너 내부는 3000
    depends_on:
      - prometheus
      - loki

  # Loki: 로그 집계(promtail이 도커 로그를 밀어넣음)
  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./ops/loki-config.yml:/etc/loki/loki-config.yml:ro
    ports:
      - "3100:3100"

  # Promtail: 컨테이너 로그 → Loki
  # ⚠️ macOS(Docker Desktop): 로그는 VM 안에 있어 /var/lib/docker/containers 바인드가 비어
  #    로그 수집이 제한됨. Linux 배포에선 정상. (컨테이너·Grafana/Loki UI는 macOS에서도 뜸.)
  promtail:
    image: grafana/promtail:latest
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./ops/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  # Jaeger: 분산 트레이싱(요청→FastAPI→워커→LLM 경로). OTLP 수신 + UI(:16686)
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"        # UI
      - "4317:4317"          # OTLP gRPC
      - "4318:4318"          # OTLP HTTP

volumes:
  pgdata:
  grafana_data:
