name: CI test
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
jobs:
  # 1) Lint: python syntax/compile check (no install, always passes)
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python compile check
        run: python3 -m py_compile $(find app -name '*.py')

  # 2) Build: verify backend docker image builds
  build:
    name: Build Docker Image
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker compose build backend

  # 3) Test: end-to-end smoke (unchanged)
  test:
    name: Run E2E Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start stack (db, redis, rabbitmq, backend, worker)
        run: docker compose up -d --build db redis rabbitmq backend worker

      - name: Wait for backend health
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8000/health; then echo "backend up"; exit 0; fi
            sleep 3
          done
          echo "backend not up"; docker compose logs --tail 50 backend; exit 1

      - name: Init DB schema + seed corpus
        run: |
          docker compose exec -T -e PYTHONPATH=/app backend python scripts/recreate_db.py
          docker compose exec -T -e PYTHONPATH=/app backend python scripts/ci_seed.py

      - name: E2E smoke (register - scan - FLAG leak - report/tree)
        run: docker compose exec -T -e PYTHONPATH=/app backend python scripts/smoke_e2e.py

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 80 backend worker

      - name: Cleanup
        if: always()
        run: docker compose down -v
