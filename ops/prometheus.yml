# Prometheus 스크레이프 설정 — backend FastAPI /metrics 수집. ARCHITECTURE.md §3.11
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  # 워커(Celery): 스캔 메트릭(침투·시도·표적지연)은 워커 프로세스에서 발생 →
  # 워커가 자체 /metrics(:9200)를 노출(celery_app worker_process_init). (#93)
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9200"]
