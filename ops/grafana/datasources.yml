# Grafana 데이터소스 자동 프로비저닝 — Prometheus(메트릭) + Loki(로그). ARCHITECTURE.md §3.11
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus          # 대시보드가 고정 uid로 참조(#93)
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
